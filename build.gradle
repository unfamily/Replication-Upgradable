plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    maven {
        url = "https://www.cursemaven.com"
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.1.2
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "curse.maven:titanium-287342:${titanium_file_id}"
    implementation "curse.maven:replication-638351:${replication_file_id}"

    // iska_lib: NeoForge 26.x — local JAR preferred
    def iskaLibLocalJar = file('libs/iska_lib-1.12.0.1.0.jar')
    if (!iskaLibLocalJar.exists()) {
        iskaLibLocalJar = file('libs/iska_lib-1.12.0.1.2.jar')
    }
    def iskaLibForceRemote = project.findProperty('iskaLibUseLocal')?.toString()?.toBoolean() == false
    if (iskaLibLocalJar.exists() && !iskaLibForceRemote) {
        implementation files(iskaLibLocalJar)
        localRuntime files(iskaLibLocalJar)
    } else {
        implementation "curse.maven:iskanderts-library-1516512:8612293"
    }

    def acmLocalJar = file('libs/another_config_manager-1.0.0.0.0.jar')
    if (!acmLocalJar.exists()) {
        acmLocalJar = file('../AnotherConfigManager-26.1.2/build/libs/another_config_manager-1.0.0.0.0.jar')
    }
    if (acmLocalJar.exists()) {
        implementation files(acmLocalJar)
        localRuntime files(acmLocalJar)
    } else {
        implementation "curse.maven:another-config-manager-1719301:9018481"
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '2000'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
