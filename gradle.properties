# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
minecraft_version=26.1.2
minecraft_version_range=[26.1.2]
# Slightly older than latest; Replication requires >=26.1.2.94
neo_version=26.1.2.121
neo_version_range=[26.1.2.94,)
loader_version_range=[6,)

## Mod Properties
mod_id=rep_up
mod_name=Replication Upgrade
mod_license=MIT
mod_version=1.0.0.1.0
mod_group_id=net.unfamily.rep_up
mod_authors=Unfamily, Iskandert
mod_description=Adds improved versions of some replication components and the Energy Materializer.

# Required dependency CurseMaven file IDs (26.1.2 NeoForge)
titanium_file_id=9145293
replication_file_id=9149093

# Iskandert Library: true = prefer libs/ JAR; false = CurseForge remote
iskaLibUseLocal=true
